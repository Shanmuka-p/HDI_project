<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result - HDI Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #3b82f6;
            --secondary-accent: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            padding: 2rem 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(17, 24, 39, 0.7);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            padding: 3rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--text-main), var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .prediction-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2.5rem;
            width: 100%;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .prediction-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
            line-height: 1.4;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 0.85rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-accent);
            transform: translateY(-2px);
        }

        .btn-back:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="result-title">Prediction Result</h2>
        
        <div class="prediction-box">
            <div class="prediction-value">
                {{ prediction_text }}
            </div>
        </div>

        <a href="/Prediction" class="btn-back">Predict Again</a>
    </div>
</body>
</html>
